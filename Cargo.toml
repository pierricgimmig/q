[workspace]
resolver = "2"
members = [
    "crates/q-core",
    "crates/q-dispatch",
    "crates/q-project",
    "crates/q-store",
    "crates/q-mcp",
    "crates/q-http",
    "crates/q-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio", "form", "query"] }
clap = { version = "4", features = ["derive"] }
q-core = { path = "crates/q-core" }
q-dispatch = { path = "crates/q-dispatch" }
q-mcp = { path = "crates/q-mcp" }
q-http = { path = "crates/q-http" }
q-project = { path = "crates/q-project" }
q-store = { path = "crates/q-store" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "net", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
